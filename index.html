  <style>
    :root {
      color-scheme: dark;
      --ink: #efe4d2;
      --muted: #c4ae8d;

    * { box-sizing: border-box; }

    .spine { position: relative; background: linear-gradient(90deg,#08090a,#292a29 45%,#101112); border-right: 1px solid rgba(255,255,255,.2); box-shadow: inset 2px 0 2px rgba(255,255,255,.1), inset -2px 0 2px rgba(0,0,0,.45); }
    .cover { position: relative; isolation: isolate; overflow: hidden; display: block; background: #111213; border: 1px solid rgba(255,255,255,.2); border-radius: 0 3px 3px 0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.22); }
    .cover-art { position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; background: #111213; }
    .cover:before { content: ""; position: absolute; z-index: 1; inset: 0; background: linear-gradient(180deg,rgba(0,0,0,.12),transparent 26%,rgba(0,0,0,.12) 43%,rgba(0,0,0,.48) 50%,rgba(0,0,0,.12) 59%,transparent 78%,rgba(0,0,0,.16)), linear-gradient(112deg,rgba(255,255,255,.24),transparent 12%,transparent 82%,rgba(255,255,255,.08)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); pointer-events: none; }
    .cover-text { position: absolute; z-index: 2; top: 50%; left: 7px; right: 7px; transform: translateY(-50%); display: grid; justify-items: center; gap: 7px; color: #fff8eb; text-align: center; text-shadow: 0 1px 3px #000, 0 2px 12px rgba(0,0,0,.95); pointer-events: none; }
    .cover-title { font-family: "Merriweather", Georgia, serif; font-size: clamp(8.424px,.806vw,11.934px); font-weight: 700; line-height: 1.2; letter-spacing: -.025em; }
    .cover-year { font: 9.72px Arial,sans-serif; letter-spacing: .16em; text-transform: uppercase; opacity: .95; }
    /* Puan kurdelesi: kapağın alt kısmında, yarı saydam yatay şerit */
    .rating-badge {
      position: absolute; z-index: 3; left: 0; right: 0; bottom: 11%;
      display: flex; align-items: baseline; justify-content: center; gap: .08em;
      font-size: clamp(9.945px, 1.0361vw, 14.9175px); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: "lnum" 1, "tnum" 1;
      padding: 3.9px 0 4.55px; color: #fff3db; font-family: "Merriweather", Georgia, serif; line-height: 1;

    .rating-badge b { font-size: 1em; font-weight: 700; letter-spacing: 0; }
    .rating-badge i { font-style: normal; font-size: 1em; font-weight: 700; letter-spacing: 0; }
    .rating-badge.unrated { padding: 3.25px 0 3.9px; font-size: 10.5px; letter-spacing: .16em; color: rgba(255,243,219,.82); background: linear-gradient(180deg, rgba(48,26,14,.5), rgba(14,8,5,.6)); }
    .fav-mark { position: absolute; z-index: 3; top: 7px; left: 7px; color: #f3d69c; font-size: 9.828px; text-shadow: 0 1px 6px #20140b; }

    footer { display: flex; justify-content: space-between; gap: 18px; padding: 22px 0 40px; border-top: 1px solid var(--line); color: var(--muted); font: 9.72px Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    .overlay { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(8, 6, 4, .88); opacity: 0; transition: opacity .2s ease; }
    .overlay.open { display: flex; opacity: 1; }
    .overlay.closing { opacity: 0; }
    .modal {
      position: relative; display: grid; grid-template-columns: .92fr 1.08fr; width: min(1080px, 100%); min-height: 550px;
      overflow: hidden; border: 10px solid #08090a; color: #f1eadc; background: #151616;
      box-shadow: 0 30px 90px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.13);
      perspective: 1500px; transform-style: preserve-3d;
    }
    .overlay.opening .modal { will-change: transform, opacity; animation: case-appear .36s cubic-bezier(.22,.7,.22,1) both; }
    .overlay.opening .modal-left { position: relative; z-index: 3; transform-origin: right center; backface-visibility: hidden; will-change: transform, opacity; animation: lid-open .56s cubic-bezier(.22,.72,.22,1) both; }
    .overlay.opening .modal-right { will-change: opacity; animation: tray-reveal .42s .1s ease-out both; }
    .overlay.opening .disc { will-change: transform, opacity; animation: disc-reveal .62s .12s cubic-bezier(.2,.72,.25,1) both; }
    .overlay.closing .modal { animation: case-close .3s ease-in both; }
    .overlay.closing .modal-left { transform-origin: right center; backface-visibility: hidden; animation: lid-close .3s ease-in both; }
    .overlay.closing .disc { animation: disc-hide .22s ease-in both; }
    @keyframes case-appear { from { opacity: .5; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
    @keyframes lid-open { from { transform: rotateY(-84deg); opacity: .72; } 88% { transform: rotateY(2deg); opacity: 1; } to { transform: rotateY(0); opacity: 1; } }
    @keyframes tray-reveal { from { opacity: .5; } to { opacity: 1; } }

    @keyframes case-close { to { opacity: .25; transform: scale(.98); } }
    @keyframes lid-close { to { transform: rotateY(-82deg); opacity: .72; } }
    @keyframes disc-hide { to { transform: scale(.88); opacity: .5; } }
    .modal:before { content: ""; position: absolute; z-index: 4; top: 0; bottom: 0; left: 46%; width: 20px; transform: translateX(-50%); background: linear-gradient(90deg, #08090a, #555653 42%, #18191a 70%, #08090a); pointer-events: none; }
    .modal-left { display: flex; flex-direction: column; padding: 44px 42px 34px; background: linear-gradient(135deg, #202121, #151616 75%); }
    .modal h3 { margin: 0 0 18px; color: #fff8eb; font-size: clamp(32.4px, 4.32vw, 50.76px); font-weight: 400; line-height: 1.08; letter-spacing: -.035em; }

    .detail span { display: block; margin-bottom: 5px; color: #c2aa83; font: 9.72px Arial, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
    .detail strong { color: #fff6e8; font-size: 15.12px; font-weight: 400; line-height: 1.45; }
    .review { margin: 22px 0 0; color: #e6d8c0; font-size: 15.12px; font-style: italic; line-height: 1.6; white-space: pre-line; }
    .modal-right { position: relative; display: grid; place-items: center; overflow: hidden; padding: 34px; background: linear-gradient(135deg, #292b2a, #131516 68%); }
    .modal-right:before { content: ""; position: absolute; inset: 15px; border: 1px solid #414342; border-radius: 3px; background: linear-gradient(145deg, #191b1c, #090a0b); box-shadow: inset 0 0 0 5px #111213, inset 0 0 0 6px rgba(255,255,255,.08), 0 0 0 1px #08090a; }
    .disc {

      background: radial-gradient(circle at center, #b9bbb3 0 2%, #252726 2.2% 3.4%, #c5c8c0 3.7% 4.3%, transparent 4.5%),
        radial-gradient(circle at 31% 22%, rgba(255,255,255,.82), transparent 24%),
        conic-gradient(from 18deg, #c3c7c1, #78817d, #e5e0cf, #89928d, #cfc7b2, #68716e, #d9ded8, #818986, #ded8c8, #727b78, #c3c7c1);
      box-shadow: 0 16px 34px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.75), inset 0 0 0 7px rgba(27,30,29,.24), inset 0 0 0 9px rgba(255,255,255,.38), inset 0 0 0 11px rgba(22,24,23,.2), inset 0 0 30px rgba(18,22,21,.42);
    }
    .disc-label { position: relative; width: 78%; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border-radius: 50%; padding: 20px; color: white; text-align: center; font-size: clamp(17.28px, 2.16vw, 24.84px); line-height: 1.12; text-shadow: 0 2px 8px rgba(0,0,0,.9); box-shadow: 0 0 0 4px rgba(214,218,207,.86), 0 2px 10px rgba(0,0,0,.55); }
    .disc-label:after { content: ""; position: absolute; z-index: 2; width: 13px; height: 13px; border: 2px solid #68716c; border-radius: 50%; background: #d2cbb6; box-shadow: 0 1px 4px rgba(0,0,0,.7); }

<body>
  <div class="shell">
    <header class="topbar">
      <div class="topright"><span class="profile-label">LETTERBOXD · BRENSVENKA</span><a class="import-btn" href="https://letterboxd.com/brensvenka/" target="_blank" rel="noreferrer">Profilim ↗</a></div>
    </header>
    <main>
      <section class="hero">
        <div><h1>DVD Koleksiyonum</h1></div>
        <div class="hero-stats"><div class="stat"><strong id="statFilms">597</strong><span>Film</span></div><div class="stat"><strong id="statRated">422</strong><span>Puanlanmış</span></div></div>
      </section>
      <nav class="collection-nav" id="collectionNav" aria-label="Koleksiyon rafları"></nav>
      <div class="controls"><span class="count" id="countLabel">597 film</span><div class="controls-left"><span>SIRALA</span><select id="sortSelect" aria-label="Filmleri sırala"><option value="watched-desc">Son izlenenden</option><option value="rating-asc">En düşük puan</option><option value="rating-desc">En yüksek puan</option><option value="title-asc">İsim · A–Z</option><option value="imdb-desc">IMDb puanı</option></select></div></div>
      <div id="shelves"></div>
      <nav class="pagination" id="pagination" aria-label="Film sayfaları" hidden></nav>
    </main>
    <footer><span>Film verisi: Letterboxd · IMDb</span><span id="syncStatus">Arşiv: 30 Eylül 2026</span></footer>
  </div>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Film detayları"><article class="modal"><button class="close" id="closeModal" aria-label="Kapat">×</button><div class="modal-left"><h3 id="modalTitle"></h3><div class="modal-rating" id="modalRating"></div><div class="details" id="modalDetails"></div><blockquote class="review" id="modalReview"></blockquote></div><div class="modal-right"><div class="disc"><div class="disc-label" id="discLabel"></div></div></div></article></div>
  <script src="films-data.js"></script>
  <script>
  const palettes=[['#263e42','#bd895d'],['#56423b','#d7aa79'],['#354b49','#b59a73'],['#4c3939','#c49072'],['#3d454e','#d0ac7e'],['#584c36','#d2b27c'],['#35433b','#9b7555'],['#51413d','#c2a17e'],['#374751','#b88a68'],['#56463a','#d1a96d'],['#423d51','#b79b82'],['#3e4d40','#bd9270'],['#543c32','#b8965f'],['#3d4545','#a97d63'],['#54443a','#c9a77e'],['#3b434b','#d2b98b'],['#514046','#bf9677'],['#3e4b50','#b58b61']];
  const demo=window.LETTERBOXD_FILMS||[];
  let films=[...demo],activeCollection='all',activeYear='',activePage=1;
  const $=s=>document.querySelector(s);const collectionNav=$('#collectionNav'), shelves=$('#shelves'), sortSelect=$('#sortSelect');
  const dv=new Map();function dateVal(s){let v=dv.get(s);if(v===undefined){const d=new Date(s);v=isNaN(d)?0:d.getTime();dv.set(s,v)}return v}
  function watchedYear(f){return f.watched?String(new Date(f.watched).getFullYear()):'Tarihsiz'}const fy=new WeakMap();function filmYears(f){let v=fy.get(f);if(!v){v=[...new Set((f.watchDates||[]).map(d=>String(new Date(d).getFullYear())).filter(y=>y!=='NaN'))];fy.set(f,v)}return v}
  let yearsCache={ref:null,val:[]};
  const thumbUrl=u=>u.replace('-0-600-0-900-','-0-460-0-690-');
  function renderNav(){if(yearsCache.ref!==films){yearsCache={ref:films,val:[...new Set(films.flatMap(f=>filmYears(f)))].sort((a,b)=>b-a)}}const years=yearsCache.val;let bits='<span class="nav-label">KOLEKSİYON</span><button class="pill '+(activeCollection==='all'?'active':'')+'" data-col="all">Tüm filmler</button><button class="pill '+(activeCollection==='favorites'?'active':'')+'" data-col="favorites">★ Favoriler</button><button class="pill '+(activeCollection==='recent'?'active':'')+'" data-col="recent">Son izlediklerim</button>';bits+=years.map(y=>`<button class="pill ${activeCollection==='year'&&activeYear===y?'active':''}" data-year="${y}">${y}</button>`).join('');collectionNav.innerHTML=bits;collectionNav.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{activeCollection=b.dataset.col;activeYear='';activePage=1;render()});collectionNav.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{activeCollection='year';activeYear=b.dataset.year;activePage=1;render()})}
  function filtered(){let list=[...films];if(activeCollection==='favorites')list=list.filter(f=>f.favorite);if(activeCollection==='recent')list.sort((a,b)=>dateVal(b.watched)-dateVal(a.watched)).splice(6);if(activeCollection==='year')list=list.filter(f=>filmYears(f).includes(activeYear));const sort=sortSelect.value;const ratingSort=sort==='rating-asc'||sort==='rating-desc';const imdbSort=sort==='imdb-desc';const cmp={ 'watched-desc':(a,b)=>dateVal(b.watched)-dateVal(a.watched),'rating-asc':(a,b)=>a.rating==null?1:b.rating==null?-1:a.rating-b.rating,'rating-desc':(a,b)=>a.rating==null?1:b.rating==null?-1:b.rating-a.rating,'title-asc':(a,b)=>a.title.localeCompare(b.title,'tr'),'imdb-desc':(a,b)=>a.imdb==null?1:b.imdb==null?-1:b.imdb-a.imdb}[sort];return list.sort((a,b)=>{const missingA=ratingSort?a.rating==null:imdbSort?a.imdb==null:false,missingB=ratingSort?b.rating==null:imdbSort?b.imdb==null:false;if(missingA!==missingB)return missingA?1:-1;return cmp(a,b)})}
  function safePoster(u){return typeof u==='string'&&/^https:\/\/a\.ltrbxd\.com\/[A-Za-z0-9\/._~%=&?-]+$/.test(u)}
  function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function card(f,i){const color=`linear-gradient(145deg,${f.colors?.[0]||palettes[i%palettes.length][0]},${f.colors?.[1]||palettes[i%palettes.length][1]})`;const poster=safePoster(f.poster)?escapeHtml(f.poster):'';const rate=f.rating==null?'<span class="rating-badge unrated">PUANSIZ</span>':`<span class="rating-badge"><b>${Number(f.rating).toFixed(0)}</b><i>/10</i></span>`;return `<div class="dvd" tabindex="0" role="button" aria-label="${escapeHtml(f.title)} detaylarını aç" data-id="${i}"><div class="dvd-case"><div class="spine" aria-hidden="true"></div><div class="cover" style="--cover:${color}">${poster?`<img class="cover-art" src="${thumbUrl(poster)}" data-full="${poster}" alt="${escapeHtml(f.title)} kapak görseli" loading="lazy" decoding="async">`:''}${f.favorite?'<span class="fav-mark">★</span>':''}${rate}<div class="cover-text"><div class="cover-title">${escapeHtml(f.art||f.title)}</div><div class="cover-year">${escapeHtml(f.year||'')}</div></div></div></div></div>`}
  function render(){renderNav();const list=filtered();$('#statFilms').textContent=films.length;$('#statRated').textContent=films.filter(f=>f.rating!=null).length;const pageSize=32;const pageCount=Math.max(1,Math.ceil(list.length/pageSize));activePage=Math.min(activePage,pageCount);const start=(activePage-1)*pageSize;const end=Math.min(start+pageSize,list.length);$('#countLabel').textContent=list.length?`${start+1}–${end} / ${list.length} film`:'0 film';const title=activeCollection==='favorites'?'Favoriler':activeCollection==='recent'?'Son izlediklerim':activeCollection==='year'?`${activeYear} · izlediklerim`:'Film raflarım';const pagination=$('#pagination');if(!list.length){shelves.innerHTML='<div class="no-results">Bu rafta henüz film yok.</div>';pagination.innerHTML='';pagination.hidden=true;return}const pageFilms=list.slice(start,end);const shelfSize=window.matchMedia('(max-width:800px)').matches?5:8;let html=`<div class="section-head"><h2>${title}</h2></div>`;for(let i=0;i<pageFilms.length;i+=shelfSize){html+=`<section class="shelf"><div class="shelf-row">${pageFilms.slice(i,i+shelfSize).map((f,j)=>card(f,start+i+j)).join('')}</div></section>`}shelves.innerHTML=html;shelves.querySelectorAll('img.cover-art[data-full]').forEach(img=>img.addEventListener('error',()=>{const f=img.dataset.full;img.removeAttribute('data-full');if(f&&img.src!==f)img.src=f},{once:true}));if(pageCount>1){pagination.innerHTML=`<button class="page-button" data-page="${activePage-1}" ${activePage===1?'disabled':''}>‹ Önceki</button><span class="page-status">Sayfa ${activePage} / ${pageCount}</span><form class="page-jump" id="pageJumpForm"><label for="pageJumpInput">Sayfaya git</label><input id="pageJumpInput" type="number" min="1" max="${pageCount}" value="${activePage}" inputmode="numeric" aria-label="Gitmek istediğiniz sayfa" required><button class="page-button" type="submit">Git</button></form><button class="page-button" data-page="${activePage+1}" ${activePage===pageCount?'disabled':''}>Sonraki ›</button>`;pagination.hidden=false;pagination.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{activePage=Number(button.dataset.page);render()});$('#pageJumpForm').onsubmit=e=>{e.preventDefault();const requested=Number($('#pageJumpInput').value);activePage=Math.max(1,Math.min(pageCount,Number.isFinite(requested)?Math.floor(requested):1));render()}}else{pagination.innerHTML='';pagination.hidden=true}shelves.querySelectorAll('.dvd').forEach(el=>{el.onclick=()=>openFilm(list[Number(el.dataset.id)]);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}})}
  function openFilm(f){$('#modalTitle').textContent=f.title;$('#modalRating').textContent=f.rating==null?'PUAN VERİLMEDİ':`KİŞİSEL PUANIM  ·  ${f.rating}/10`;const watchCount=(f.watchDates||[]).length;const watchText=f.watched?`${new Date(f.watched).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'})}${watchCount>1?` · ${watchCount} kez izlendi`:''}`:'Günlük kaydı yok';const info=[['Yönetmen',f.director||'—'],['İzleme tarihi',watchText],['Çıkış yılı',f.year||'—'],['IMDb puanı',f.imdb!=null?`${Number(f.imdb).toFixed(1)} / 10`:'—']];$('#modalDetails').innerHTML=info.map(x=>`<div class="detail"><span>${x[0]}</span><strong>${escapeHtml(x[1])}</strong></div>`).join('');const review=$('#modalReview');review.textContent=f.review||'';review.style.display=f.review?'block':'none';$('.disc-label').textContent=f.art||f.title;const discColor=`linear-gradient(145deg,${f.colors?.[0]||'#39433d'},${f.colors?.[1]||'#b58b61'})`;const isPoster=f.poster&&f.poster.startsWith('https://a.ltrbxd.com/');const discBg=u=>`linear-gradient(145deg,rgba(25,20,15,.45),rgba(25,20,15,.2)),url("${u}")`;$('.disc-label').style.backgroundImage=isPoster?discBg(thumbUrl(f.poster)):discColor;if(isPoster){const probe=new Image();probe.onerror=()=>{$('.disc-label').style.backgroundImage=discBg(f.poster)};probe.src=thumbUrl(f.poster)}$('.disc-label').style.backgroundSize='cover';$('.disc-label').style.backgroundPosition='center';$('#overlay').classList.add('open');document.body.style.overflow='hidden';$('#closeModal').focus()}
  function closeModal(){$('#overlay').classList.remove('open');document.body.style.overflow=''}$('#closeModal').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});sortSelect.onchange=()=>{activePage=1;render()};
  render();(()=>{const u=window.LETTERBOXD_UPDATED_AT;if(!u)return;const d=new Date(u);if(isNaN(d))return;$('#syncStatus').textContent='Letterboxd eşitlendi · '+d.toLocaleString('tr-TR',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Istanbul'})})();let lastShelfSize=window.matchMedia('(max-width:800px)').matches?5:8;window.addEventListener('resize',()=>{const nextSize=window.matchMedia('(max-width:800px)').matches?5:8;if(nextSize!==lastShelfSize){lastShelfSize=nextSize;render()}});
  const baseOpenFilm=openFilm;let modalCloseTimer=0,modalAnimationTimer=0;openFilm=function(f){clearTimeout(modalCloseTimer);clearTimeout(modalAnimationTimer);const overlay=$('#overlay');overlay.classList.remove('closing','opening');baseOpenFilm(f);void overlay.offsetWidth;requestAnimationFrame(()=>{if(overlay.classList.contains('open')){overlay.classList.add('opening');modalAnimationTimer=setTimeout(()=>overlay.classList.remove('opening'),780)}})};closeModal=function(){const overlay=$('#overlay');if(!overlay.classList.contains('open'))return;clearTimeout(modalAnimationTimer);clearTimeout(modalCloseTimer);overlay.classList.remove('opening');overlay.classList.add('closing');document.body.style.overflow='';modalCloseTimer=setTimeout(()=>overlay.classList.remove('open','closing'),310)};$('#closeModal').onclick=closeModal;
  </script>
